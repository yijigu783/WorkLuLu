[package]
name = "worklog"
version = "1.6.0"
description = "工作记录本 (WorkLuLu) - 单文件绿色的本地工作记录与周期排期工具"
authors = ["JJAI"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 见下方 [dependencies] 中 indexmap 的说明：resolver v2 会隔离 build 依赖的特性集合，
# 因此这里需要再声明一次，确保 build 依赖图中的 indexmap 也带上 std 特性。
indexmap = { version = "1.9.3", features = ["std"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
# 备份 / 恢复要用原生的「另存为」和「打开文件」对话框。
# 前端通过 plugin:dialog|save / plugin:dialog|open 直接调，不需要 npm 依赖。
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
# 附件（粘贴的图片 / 上传的文件）走 JSON 传递，二进制得先编成 base64 文本。
# 这个 crate 本来就在依赖树里（tauri 间接用），显式声明不增加编译量。
base64 = "0.22"
# 三端共享业务层（数据模型 + 周期排期引擎）。安卓版依赖同一个 crate，
# 排期算法因此只有一份实现 —— 见 core/src/lib.rs 顶部的三条纪律。
worklog-core = { path = "../../core" }
# 三端共享数据访问层（建表 + 增量迁移 + 增删改查）。命令层只做「取锁 → 交给它」
# 的薄包装，逻辑一行都不留在本 crate 里 —— 安卓版依赖同一个 crate。
# 分开而不是塞进 core：core 有三条纪律（不依赖 tauri、不碰文件、不取系统时钟），
# 数据层天生要违反后两条，硬塞进去会把 core 的规矩搞坏。
worklog-data = { path = "../../data" }

# schemars 0.8 (tauri 的间接依赖) 需要 indexmap 1.x。
# indexmap 1.9.3 通过 autocfg 探测 std：探测失败时会退化成 no_std，
# 使 `IndexMap<K, V>` 丢掉默认泛型参数 S，导致 schemars 编译报 E0107。
# 显式打开 std 特性后，构建脚本直接 emit `has_std`，不再做子进程探测。
indexmap = { version = "1.9.3", features = ["std"] }

[target.'cfg(windows)'.dependencies]
# 要「点了通知能跳回那一条工作」，就必须拿到 winrt 的激活回调。
# tauri-plugin-notification 的 builder 是发完即忘的，只能下探到它底层的这个 crate
# （本来就在依赖树里，不增加编译量）。
tauri-winrt-notification = "0.7"
# 注册通知用的 AUMID 走系统 API 而不是 `reg.exe`：调外部进程既慢，
# 又容易被安全软件记一笔。windows crate 本来就在依赖树里，只多编一个模块。
windows = { version = "0.61", features = [
    "Win32_System_Registry",
    "Win32_Foundation",
    # RegCreateKeyExW 的签名里带 SECURITY_ATTRIBUTES，整个函数被这个特性门控着
    "Win32_Security",
    # 下面三个是窗口行为（src/win32.rs、src/snap.rs、src/single.rs）需要的：
    #   Win32_Graphics_Gdi            MonitorFromWindow / GetMonitorInfoW —— 拿工作区，
    #                                 吸附才能避开任务栏而不是压在它上面
    #   Win32_UI_WindowsAndMessaging FindWindowW / SetForegroundWindow / AttachThreadInput
    #                                 / SetWindowPos / GetWindowRect —— 找旧窗口、请到前台、
    #                                 把滑出屏幕的窗口挪回来
    #   Win32_System_Threading        CreateMutexW / GetCurrentThreadId —— 单实例互斥体
    #   Win32_UI_Input_KeyboardAndMouse
    #                                 GetAsyncKeyState —— 贴边隐藏要问「左键还按着吗」，
    #                                 拖动中不能把窗口滑走
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }

# 注意：[profile.release] 已提到工作区根（仓库根的 Cargo.toml）。
# cargo 会忽略非根成员的 profile 设置，留在这里等于没写 —— 交付 exe 的体积和
# panic 行为都会变，而且不报错，只在构建时给一行容易被忽略的 warning。
